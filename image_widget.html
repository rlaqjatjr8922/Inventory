<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font:14px system-ui,sans-serif;color:light-dark(#202124,#eee);color-scheme:light dark}
main{padding:16px}img{display:block;max-width:100%;max-height:480px;margin:12px auto;object-fit:contain;border-radius:8px}
button{padding:10px 16px;border:0;border-radius:8px;background:#176b52;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:default}
p{line-height:1.5}#label{font-weight:600}
</style></head>
<body><main><div id="label">사진 불러오는 중</div><img id="photo" hidden alt="Inventory 사진">
<p id="status" role="status">사진을 기다리고 있습니다.</p>
<button id="analyze" hidden disabled>사진 전달 다시 시도</button></main>
<script>
(() => {
  const label = document.getElementById('label');
  const photo = document.getElementById('photo');
  const status = document.getElementById('status');
  const button = document.getElementById('analyze');
  let current = null, requestId = 0;
  const pending = new Map();
  function rpc(method, params) {
    const id = ++requestId;
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { pending.delete(id); reject(new Error('호스트 응답 시간 초과')); }, 15000);
      pending.set(id, {resolve, reject, timeout});
      window.parent.postMessage({jsonrpc:'2.0', id, method, params}, '*');
    });
  }
  function render(result) {
    if (!result) return;
    const output = result.structuredContent || result.structured_content || {
      image_id: result._meta?.['inventory/image_id'] ?? result.meta?.['inventory/image_id']
    };
    const block = result._meta?.['inventory/image'] || result.meta?.['inventory/image'] || result.content?.find(x => x.type === 'image');
    if (!Number.isSafeInteger(output.image_id) || !block?.data || !['image/jpeg','image/png'].includes(block.mimeType)) return;
    if (current?.id === output.image_id) return;
    current = {id:output.image_id, block};
    label.textContent = 'image_id: ' + current.id;
    photo.src = 'data:' + block.mimeType + ';base64,' + block.data;
    photo.hidden = false;
    photo.alt = 'Inventory 이미지 ' + current.id;
    status.textContent = '이미지는 도구 응답으로 전달되었습니다.';
    button.hidden = true;

  }
  function readGlobals() {
    const api = window.openai;
    const metadata = api?.toolResponseMetadata;
    render(metadata?.mcp_tool_result || metadata?.call_tool_result);
    if (!current && api?.toolOutput) render({structuredContent:api.toolOutput, _meta:metadata});

  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
    const message = event.data;
    if (pending.has(message.id)) {
      const task = pending.get(message.id);
      pending.delete(message.id); clearTimeout(task.timeout);
      message.error ? task.reject(new Error(message.error.message)) : task.resolve(message.result);
    }
    if (message.method === 'ui/notifications/tool-result') render(message.params);
  });
  window.addEventListener('openai:set_globals', readGlobals);
  readGlobals();
  rpc('ui/initialize', {appInfo:{name:'Inventory image input',version:'3.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'})
    .then(() => window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}}, '*'))
    .catch(() => readGlobals());
})();
</script></body></html>
