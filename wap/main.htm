<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>재고 관리</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h1>재고관리</h1>

        <nav>

            <button
                class="menu-button active"
                data-page="trade"
                type="button"
            >
                거래
            </button>

            <button
                class="menu-button"
                data-page="inventory"
                type="button"
            >
                재고
            </button>

            <button
                class="menu-button"
                data-page="memory"
                type="button"
            >
                메모리
            </button>

        </nav>

    </aside>


    <div class="main-area">

        <!-- 상단 요약 -->

        <section class="summary">

            <div class="summary-box">

                <span>
                    총 매입
                </span>

                <strong id="total-buy">
                    0원
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    총 판매
                </span>

                <strong id="total-sell">
                    0원
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    순이익
                </span>

                <strong id="total-profit">
                    0원
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    재고 수
                </span>

                <strong id="stock-count">
                    0개
                </strong>

            </div>

        </section>


        <main class="content">

            <!-- ================================================= -->
            <!-- 거래 -->
            <!-- ================================================= -->

            <section
                id="page-trade"
                class="page active"
            >

                <div class="panel">

                    <h2>
                        거래 등록
                    </h2>


                    <div class="form-group">

                        <label>
                            구분
                        </label>


                        <div class="type-buttons">

                            <button
                                id="buy-button"
                                class="type-button active"
                                type="button"
                            >
                                매입
                            </button>


                            <button
                                id="sell-button"
                                class="type-button"
                                type="button"
                            >
                                판매
                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="transaction-price">
                            금액
                        </label>


                        <input
                            id="transaction-price"
                            type="number"
                            min="1"
                            placeholder="금액 입력"
                        >


                        <div
                            id="price-text"
                            class="price-text"
                        >
                            0원
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="transaction-memo">
                            메모
                        </label>


                        <input
                            id="transaction-memo"
                            type="text"
                            placeholder="메모 입력"
                        >

                    </div>


                    <!-- 매입 관련부품 -->

                    <div
                        id="buy-parts-area"
                        class="form-group"
                    >

                        <div class="section-title">

                            <label>
                                매입 부품
                            </label>


                            <button
                                id="add-part-button"
                                type="button"
                            >
                                + 부품 추가
                            </button>

                        </div>


                        <div id="new-parts-list">
                        </div>

                    </div>


                    <!-- 판매 관련부품 -->

                    <div
                        id="sell-parts-area"
                        class="form-group hidden"
                    >

                        <label>
                            판매할 부품
                        </label>


                        <div
                            id="sell-parts-list"
                            class="sell-parts-list"
                        >
                        </div>

                    </div>


                    <div class="button-area">

                        <button
                            id="transaction-add-button"
                            type="button"
                        >
                            거래 등록
                        </button>

                    </div>


                    <p
                        id="transaction-message"
                        class="message"
                    ></p>

                </div>

            </section>


            <!-- ================================================= -->
            <!-- 메모리 -->
            <!-- ================================================= -->

            <section
                id="page-memory"
                class="page"
            >

                <div class="memory-layout">

                    <div class="panel memory-list-panel">

                        <div class="memory-heading">
                            <h2>메모리</h2>

                            <button
                                id="new-memory-button"
                                type="button"
                            >
                                + 새 메모
                            </button>
                        </div>

                        <div class="memory-search-grid">
                            <input
                                id="memory-search"
                                type="search"
                                placeholder="제목·작업내용·결과 검색"
                            >

                            <select id="memory-category-filter">
                                <option value="">상위태그 전체</option>
                            </select>

                            <select id="memory-status-filter">
                                <option value="">상태 전체</option>
                                <option value="진행중">진행중</option>
                                <option value="완료">완료</option>
                                <option value="보류">보류</option>
                                <option value="폐기">폐기</option>
                            </select>

                            <select id="memory-priority-filter">
                                <option value="0">우선도 전체</option>
                                <option value="3">높음 이상</option>
                                <option value="4">매우높음 이상</option>
                                <option value="5">고정만</option>
                            </select>
                        </div>

                        <div
                            id="memory-result-count"
                            class="result-count"
                        ></div>

                        <div id="memory-list" class="memory-list"></div>

                    </div>


                    <div class="panel memory-editor-panel">

                        <div class="memory-heading">
                            <h2 id="memory-editor-title">새 메모</h2>

                            <button
                                id="delete-memory-button"
                                class="danger-button hidden"
                                type="button"
                            >
                                삭제
                            </button>
                        </div>

                        <div class="memory-basic-grid">
                            <div class="form-group">
                                <label for="memory-category">상위태그</label>
                                <div class="memory-category-row">
                                    <select id="memory-category"></select>
                                    <button
                                        id="add-memory-category-button"
                                        class="secondary-button"
                                        type="button"
                                    >
                                        + 추가
                                    </button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="memory-title">제목</label>
                                <input
                                    id="memory-title"
                                    type="text"
                                    placeholder="예: GTX960 전원부 점검"
                                >
                            </div>

                            <div class="form-group">
                                <label for="memory-priority">우선도</label>
                                <select id="memory-priority">
                                    <option value="1">1 · 낮음</option>
                                    <option value="2" selected>2 · 보통</option>
                                    <option value="3">3 · 높음</option>
                                    <option value="4">4 · 매우높음</option>
                                    <option value="5">5 · 고정</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="memory-status">상태</label>
                                <select id="memory-status">
                                    <option value="진행중">진행중</option>
                                    <option value="완료">완료</option>
                                    <option value="보류">보류</option>
                                    <option value="폐기">폐기</option>
                                </select>
                            </div>
                        </div>

                        <div class="memory-section-heading">
                            <h3>작업내용</h3>
                            <button
                                id="add-memory-work-button"
                                class="secondary-button small-button"
                                type="button"
                            >
                                + 작업 추가
                            </button>
                        </div>

                        <div id="memory-work-list" class="memory-work-list"></div>

                        <div class="form-group">
                            <label for="memory-conclusion">최종결론</label>
                            <textarea
                                id="memory-conclusion"
                                rows="3"
                                placeholder="작업이 끝났을 때 전체 결론을 입력"
                            ></textarea>
                        </div>

                        <div class="memory-section-heading">
                            <h3>이미지</h3>
                            <span class="memory-help">본문 참조: [[이미지:번호]]</span>
                        </div>

                        <div class="memory-upload-row">
                            <input
                                id="memory-image-file"
                                type="file"
                                accept="image/jpeg,image/png,image/webp"
                            >
                            <input
                                id="memory-image-description"
                                type="text"
                                placeholder="이미지 설명"
                            >
                            <button
                                id="upload-memory-image-button"
                                type="button"
                            >
                                이미지 추가
                            </button>
                        </div>

                        <p id="memory-upload-help" class="memory-help">
                            새 메모는 먼저 저장한 뒤 이미지를 추가할 수 있습니다.
                        </p>

                        <div id="memory-attachment-list" class="memory-attachment-list"></div>

                        <div class="memory-meta" id="memory-meta"></div>
                        <p id="memory-message" class="message"></p>

                        <div class="edit-actions">
                            <button
                                id="reset-memory-button"
                                class="secondary-button"
                                type="button"
                            >
                                입력 초기화
                            </button>

                            <button
                                id="save-memory-button"
                                type="button"
                            >
                                저장
                            </button>
                        </div>

                    </div>

                </div>

            </section>


            <!-- ================================================= -->
            <!-- 재고 -->
            <!-- ================================================= -->

            <section
                id="page-inventory"
                class="page"
            >

                <div class="panel">

                    <h2>
                        재고
                    </h2>


                    <div class="inventory-toolbar">

                        <select id="inventory-mode">

                            <option value="parts">
                                부품
                            </option>

                            <option value="transactions">
                                거래내역
                            </option>

                        </select>


                        <input
                            id="inventory-search"
                            type="text"
                            placeholder="검색어 입력"
                        >


                        <button
                            id="inventory-search-button"
                            type="button"
                        >
                            검색
                        </button>

                    </div>


                    <div
                        id="parts-filter-area"
                        class="filter-area"
                    >

                        <select id="filter-buy-group">
                            <option value="">매입그룹 전체</option>
                        </select>

                        <select id="filter-sell-group">
                            <option value="">판매그룹 전체</option>
                            <option value="unsold">미판매</option>
                            <option value="sold">판매완료</option>
                        </select>

                        <select id="filter-part-type">
                            <option value="">종류 전체</option>
                            <option value="1">CPU</option>
                            <option value="2">GPU</option>
                            <option value="3">메인보드</option>
                            <option value="4">RAM</option>
                            <option value="5">SSD</option>
                            <option value="6">HDD</option>
                            <option value="7">파워</option>
                            <option value="8">팬</option>
                            <option value="9">케이스</option>
                            <option value="10">쿨러</option>
                            <option value="11">기타</option>
                        </select>

                        <select id="filter-part-status">
                            <option value="">고장여부 전체</option>
                            <option value="1">정상</option>
                            <option value="2">고장</option>
                            <option value="3">미확인</option>
                        </select>

                        <button
                            id="parts-filter-reset"
                            class="secondary-button"
                            type="button"
                        >
                            필터 초기화
                        </button>

                    </div>


                    <div
                        id="transactions-filter-area"
                        class="filter-area hidden"
                    >

                        <select id="filter-transaction-type">
                            <option value="">구분 전체</option>
                            <option value="1">매입</option>
                            <option value="2">판매</option>
                        </select>

                        <select id="filter-transaction-days">
                            <option value="">기간 전체</option>
                            <option value="0">오늘</option>
                            <option value="1">최근 1일</option>
                            <option value="3">최근 3일</option>
                            <option value="7">최근 7일</option>
                            <option value="30">최근 30일</option>
                        </select>

                        <button
                            id="transactions-filter-reset"
                            class="secondary-button"
                            type="button"
                        >
                            필터 초기화
                        </button>

                    </div>


                    <div
                        id="inventory-result-count"
                        class="result-count"
                    >
                    </div>


                    <div class="table-area">

                        <table id="parts-result-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>이름</th>
                                    <th>종류</th>
                                    <th>상태</th>
                                    <th>매입그룹</th>
                                    <th>판매그룹</th>
                                    <th>작업</th>
                                </tr>
                            </thead>

                            <tbody id="parts-table">
                            </tbody>
                        </table>


                        <table
                            id="transactions-result-table"
                            class="hidden"
                        >
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>구분</th>
                                    <th>거래그룹</th>
                                    <th>금액</th>
                                    <th>날짜</th>
                                    <th>메모</th>
                                    <th>관련부품</th>
                                    <th>작업</th>
                                </tr>
                            </thead>

                            <tbody id="inventory-transactions-table">
                            </tbody>
                        </table>

                    </div>

                </div>

            </section>


            <!-- ================================================= -->
            <!-- 부품 수정 -->
            <!-- ================================================= -->

            <section
                id="page-part-edit"
                class="page"
            >

                <div class="panel edit-panel">

                    <div class="edit-header">

                        <div>
                            <h2>부품 수정</h2>
                            <span id="edit-part-id-text"></span>
                        </div>

                        <button
                            id="delete-part-button"
                            class="danger-button"
                            type="button"
                        >
                            삭제
                        </button>

                    </div>


                    <div class="form-group">
                        <label for="edit-part-name">이름</label>
                        <input id="edit-part-name" type="text">
                    </div>

                    <div class="form-group">
                        <label for="edit-part-type">종류</label>
                        <select id="edit-part-type">
                            <option value="1">CPU</option>
                            <option value="2">GPU</option>
                            <option value="3">메인보드</option>
                            <option value="4">RAM</option>
                            <option value="5">SSD</option>
                            <option value="6">HDD</option>
                            <option value="7">파워</option>
                            <option value="8">팬</option>
                            <option value="9">케이스</option>
                            <option value="10">쿨러</option>
                            <option value="11">기타</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit-part-status">고장여부</label>
                        <select id="edit-part-status">
                            <option value="1">정상</option>
                            <option value="2">고장</option>
                            <option value="3">미확인</option>
                        </select>
                    </div>


                    <div class="readonly-info">
                        <div>
                            <span>매입그룹</span>
                            <strong id="edit-buy-group">-</strong>
                        </div>

                        <div>
                            <span>판매그룹</span>
                            <strong id="edit-sell-group">-</strong>
                        </div>
                    </div>

                    <p id="edit-part-message" class="message"></p>

                    <div class="edit-actions">
                        <button
                            id="cancel-part-edit-button"
                            class="secondary-button"
                            type="button"
                        >
                            취소
                        </button>

                        <button
                            id="save-part-button"
                            type="button"
                        >
                            저장
                        </button>
                    </div>

                </div>

            </section>


            <!-- ================================================= -->
            <!-- 거래 수정 -->
            <!-- ================================================= -->

            <section
                id="page-transaction-edit"
                class="page"
            >

                <div class="panel edit-panel">

                    <div class="edit-header">
                        <div>
                            <h2>거래 수정</h2>
                            <span id="edit-transaction-id-text"></span>
                        </div>

                        <button
                            id="delete-transaction-button"
                            class="danger-button"
                            type="button"
                        >
                            거래 삭제
                        </button>
                    </div>


                    <div class="form-group">
                        <label for="edit-transaction-type">구분</label>
                        <select id="edit-transaction-type">
                            <option value="1">매입</option>
                            <option value="2">판매</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit-transaction-price">금액</label>
                        <input
                            id="edit-transaction-price"
                            type="number"
                            min="1"
                        >

                        <div
                            id="edit-transaction-price-text"
                            class="price-text"
                        >
                            0원
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="edit-transaction-memo">메모</label>
                        <input id="edit-transaction-memo" type="text">
                    </div>

                    <div class="form-group">
                        <div class="section-title">
                            <label>관련부품</label>
                            <button
                                id="edit-add-part-button"
                                type="button"
                            >
                                + 새 부품 추가
                            </button>
                        </div>

                        <div id="edit-transaction-parts-list">
                        </div>
                    </div>

                    <div class="readonly-info">
                        <div>
                            <span>거래그룹</span>
                            <strong id="edit-transaction-group">-</strong>
                        </div>

                        <div>
                            <span>날짜</span>
                            <strong id="edit-transaction-date">-</strong>
                        </div>
                    </div>

                    <p id="edit-transaction-message" class="message"></p>

                    <div class="edit-actions">
                        <button
                            id="cancel-transaction-edit-button"
                            class="secondary-button"
                            type="button"
                        >
                            취소
                        </button>

                        <button
                            id="save-transaction-button"
                            type="button"
                        >
                            저장
                        </button>
                    </div>

                </div>

            </section>

        </main>

    </div>

</div>


<script src="/js/summary.js"></script>
<script src="/js/parts.js"></script>
<script src="/js/trade.js"></script>
<script src="/js/pricing.js"></script>
<script src="/js/memory.js"></script>
<script src="/js/menu.js"></script>

</body>

</html>
